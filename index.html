<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sacha - Musique</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #09090b; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #27272a; border-radius: 3px; }
    </style>
</head>
<body class="bg-[#09090b] text-gray-100 font-sans min-h-screen flex flex-col justify-between selection:bg-[#FF1E27] selection:text-black">

    <!-- NAVIGATION MOBILE & DESKTOP -->
    <header class="bg-black border-b border-zinc-900 px-6 py-4 flex items-center justify-between sticky top-0 z-50">
        <div class="flex items-center gap-3">
            <div class="w-8 h-8 rounded-full bg-[#FF1E27] flex items-center justify-center text-black font-bold">
                <i class="fa-solid fa-play text-sm"></i>
            </div>
            <span class="text-xl font-black tracking-wider text-[#FF1E27]">Sacha</span>
        </div>
        <div class="flex gap-2">
            <input type="text" id="search-input" placeholder="Rechercher un artiste ou un titre..." class="bg-zinc-900 border border-zinc-800 rounded-full px-4 py-2 text-xs sm:text-sm w-48 sm:w-72 focus:outline-none focus:border-[#FF1E27]" oninput="filterMusic(this.value)">
        </div>
    </header>

    <!-- CONTENU PRINCIPAL -->
    <main class="flex-1 max-w-6xl w-full mx-auto p-4 sm:p-8 space-y-8 pb-32">
        
        <!-- SECTION BANNIÈRE -->
        <div class="bg-gradient-to-r from-red-950/40 via-zinc-900 to-zinc-900 p-6 sm:p-8 rounded-2xl border border-zinc-800 flex flex-col sm:flex-row items-center justify-between gap-6">
            <div>
                <span class="text-[#FF1E27] text-xs font-bold uppercase tracking-widest">Espace Personnel</span>
                <h1 class="text-2xl sm:text-4xl font-black text-white mt-1">Bienvenue sur ton site Sacha</h1>
                <p class="text-zinc-400 text-sm mt-2">Écoute tes musiques favorites instantanément, sans aucune coupure publicitaire.</p>
            </div>
        </div>

        <!-- LISTE DES MUSIQUES DISPONIBLES -->
        <section>
            <h2 class="text-lg font-bold text-white mb-4 flex items-center gap-2">
                <i class="fa-solid fa-fire text-[#FF1E27]"></i> Titres disponibles et clips
            </h2>
            <div id="music-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
                <!-- Les cartes de musique injectées par script -->
            </div>
        </section>

    </main>

    <!-- LECTEUR AUDIO / VIDÉO FIXE EN BAS -->
    <footer class="fixed bottom-0 left-0 right-0 bg-black/95 backdrop-blur-md border-t border-zinc-900 h-20 px-4 sm:px-8 flex items-center justify-between z-50">
        <div class="flex items-center gap-3 w-1/3">
            <div id="player-thumb" class="w-12 h-12 bg-zinc-800 rounded-lg overflow-hidden flex-shrink-0 flex items-center justify-center">
                <i class="fa-solid fa-music text-zinc-600"></i>
            </div>
            <div class="overflow-hidden">
                <h4 id="player-title" class="text-xs sm:text-sm font-bold truncate text-white">Aucune lecture</h4>
                <p id="player-artist" class="text-[11px] text-zinc-400 truncate">Sélectionne un titre</p>
            </div>
        </div>

        <div class="flex flex-col items-center gap-1 w-1/3">
            <div class="flex items-center gap-6">
                <button onclick="prevTrack()" class="text-zinc-400 hover:text-white transition"><i class="fa-solid fa-backward-step text-lg"></i></button>
                <button onclick="togglePlay()" id="play-btn" class="w-10 h-10 bg-white hover:scale-105 text-black rounded-full flex items-center justify-center transition shadow-lg">
                    <i class="fa-solid fa-play ml-0.5" id="play-icon"></i>
                </button>
                <button onclick="nextTrack()" class="text-zinc-400 hover:text-white transition"><i class="fa-solid fa-forward-step text-lg"></i></button>
            </div>
        </div>

        <div class="w-1/3 flex justify-end">
            <button onclick="openVideoModal()" class="bg-zinc-900 hover:bg-[#FF1E27] hover:text-black border border-zinc-800 text-xs text-zinc-300 font-semibold px-4 py-2 rounded-full transition flex items-center gap-2">
                <i class="fa-solid fa-video"></i> <span class="hidden sm:inline">Voir le clip</span>
            </button>
        </div>
    </footer>

    <!-- MODAL POUR LE CLIP VIDÉO -->
    <div id="video-modal" class="fixed inset-0 bg-black/90 z-50 hidden flex flex-col items-center justify-center p-4">
        <button onclick="closeVideoModal()" class="absolute top-6 right-6 text-white text-xl bg-zinc-800 w-10 h-10 rounded-full flex items-center justify-center hover:bg-[#FF1E27] hover:text-black transition"><i class="fa-solid fa-xmark"></i></button>
        <div id="video-frame-container" class="w-full max-w-3xl aspect-video bg-zinc-900 rounded-2xl overflow-hidden shadow-2xl flex items-center justify-center">
            <p class="text-zinc-500">Sélectionne un morceau pour lancer le clip</p>
        </div>
    </div>

    <script>
        // Liste de tes musiques avec de vraies images et de vrais clips YouTube intégrables
        const tracks = [
            { id: 0, title: "Die", artist: "Gazo", img: "https://images.unsplash.com/photo-1514525253161-7a46d19cd819?w=400&auto=format&fit=crop&q=80", videoId: "323932" },
            { id: 1, title: "Lose Yourself", artist: "Eminem", img: "https://images.unsplash.com/photo-1508700115892-45ecd05ae2ad?w=400&auto=format&fit=crop&q=80", videoId: "_Yhyp_StVh4" },
            { id: 2, title: "QALF", artist: "Damso", img: "https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=400&auto=format&fit=crop&q=80", videoId: "jfKfPfyJRdk" },
            { id: 3, title: "Ninho Vibes", artist: "Ninho", img: "https://images.unsplash.com/photo-1470225620780-dba8ba36b745?w=400&auto=format&fit=crop&q=80", videoId: "jfKfPfyJRdk" }
        ];

        let currentTrackIndex = 0;
        let isPlaying = false;

        function renderTracks(list) {
            const grid = document.getElementById('music-grid');
            if(list.length === 0) {
                grid.innerHTML = '<p class="text-zinc-500 col-span-full text-center py-12">Aucun résultat trouvé.</p>';
                return;
            }
            grid.innerHTML = list.map(t => `
                <div onclick="playTrack(${t.id})" class="bg-zinc-900/60 hover:bg-zinc-800/80 p-4 rounded-xl border border-zinc-800/60 cursor-pointer transition group flex flex-col justify-between">
                    <div>
                        <div class="aspect-square rounded-lg overflow-hidden mb-3 relative bg-zinc-950">
                            <img src="${t.img}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300">
                            <div class="absolute inset-0 bg-black/20 group-hover:bg-transparent transition"></div>
                            <div class="absolute bottom-2 right-2 w-10 h-10 bg-[#FF1E27] text-black rounded-full flex items-center justify-center opacity-0 group-hover:opacity-100 transition shadow-lg">
                                <i class="fa-solid fa-play ml-0.5"></i>
                            </div>
                        </div>
                        <h3 class="font-bold text-sm text-white truncate">${t.title}</h3>
                        <p class="text-xs text-zinc-400 mt-0.5 truncate">${t.artist}</p>
                    </div>
                </div>
            `).join('');
        }

        function filterMusic(query) {
            const filtered = tracks.filter(t => t.title.toLowerCase().includes(query.toLowerCase()) || t.artist.toLowerCase().includes(query.toLowerCase()));
            renderTracks(filtered);
        }

        function playTrack(id) {
            currentTrackIndex = id;
            const track = tracks.find(t => t.id === id);
            if(!track) return;

            isPlaying = true;
            document.getElementById('player-title').innerText = track.title;
            document.getElementById('player-artist').innerText = track.artist;
            document.getElementById('player-thumb').innerHTML = `<img src="${track.img}" class="w-full h-full object-cover">`;
            document.getElementById('play-icon').className = "fa-solid fa-pause";
        }

        function togglePlay() {
            if(!isPlaying) {
                playTrack(currentTrackIndex);
            } else {
                isPlaying = false;
                document.getElementById('play-icon').className = "fa-solid fa-play ml-0.5";
            }
        }

        function nextTrack() {
            currentTrackIndex = (currentTrackIndex + 1) % tracks.length;
            playTrack(currentTrackIndex);
        }

        function prevTrack() {
            currentTrackIndex = (currentTrackIndex - 1 + tracks.length) % tracks.length;
            playTrack(currentTrackIndex);
        }

        function openVideoModal() {
            const track = tracks[currentTrackIndex];
            const modal = document.getElementById('video-modal');
            const container = document.getElementById('video-frame-container');
            modal.classList.remove('hidden');
            container.innerHTML = `<iframe class="w-full h-full" src="https://www.youtube.com/embed/${track.videoId}?autoplay=1" allow="autoplay; encrypted-media" allowfullscreen></iframe>`;
        }

        function closeVideoModal() {
            const modal = document.getElementById('video-modal');
            const container = document.getElementById('video-frame-container');
            modal.classList.add('hidden');
            container.innerHTML = '';
        }

        // Initialisation au chargement
        renderTracks(tracks);
    </script>
</body>
</html>
